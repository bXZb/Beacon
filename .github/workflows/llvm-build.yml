name: llvm-build

# Root CMake + clang-cl/xwin toolchain. Pass plugin is a separate host CMake
# (cannot use the Windows toolchain). Triggered on cmake and llvm branches.
on:
  push:
    branches: [cmake, llvm]
  workflow_dispatch:

env:
  LLVM_VERSION: 19.1.7
  XWIN_VERSION: 0.10.0

jobs:
  linux-x64:
    name: linux cross (clang-cl)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache cross toolchain
        uses: actions/cache@v4
        with:
          path: ~/.llvm-cross
          key: llvm-cross-${{ env.LLVM_VERSION }}-xwin-${{ env.XWIN_VERSION }}-linux-v1

      - name: Ninja
        run: sudo apt-get update -qq && sudo apt-get install -y ninja-build

      - name: Setup LLVM + xwin
        run: bash tools/llvm/setup-host.sh

      - name: Build pass plugin (host CMake)
        run: |
          set -e
          source "$HOME/.llvm-cross/toolpath.env"
          cmake -S tools/llvm/pass -B build-pass \
            -DLLVM_DIR="$HOME/.llvm-cross/llvm/lib/cmake/llvm" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-pass -j 2
          ls -la build-pass/obfpasses.so

      - name: Configure root CMake (LLVM toolchain)
        run: |
          set -e
          source "$HOME/.llvm-cross/toolpath.env"
          cmake -S . -B build-llvm -G Ninja \
            --toolchain cmake/toolchain-clang-cl-xwin.cmake \
            -DCLANG_CL="$LLVM_CLANG" \
            -DLLD_LINK="$LLVM_LLD" \
            -DXWIN_DIR="$XWIN_SPLAT" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBEACON_OBF_PLUGIN="$PWD/build-pass/obfpasses.so" \
            -DBEACON_OBF_SEED=1337

      - name: Build
        run: cmake --build build-llvm --parallel

      - name: List artifacts
        run: ls -la build-llvm/out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llvm-linux-x64
          path: |
            build-llvm/out/*.dll
            build-llvm/out/*.map

  windows-x64:
    name: windows host (clang-cl)
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Cache xwin splat
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\.llvm-cross
          key: llvm-cross-${{ env.LLVM_VERSION }}-xwin-${{ env.XWIN_VERSION }}-win-v1

      - name: Setup LLVM + xwin
        run: bash tools/llvm/setup-host.sh

      - name: Ninja
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Configure root CMake (LLVM toolchain)
        run: |
          set -e
          source "$HOME/.llvm-cross/toolpath.env"
          cmake -S . -B build-llvm -G Ninja \
            --toolchain cmake/toolchain-clang-cl-xwin.cmake \
            -DCLANG_CL="$LLVM_CLANG" \
            -DLLD_LINK="$LLVM_LLD" \
            -DXWIN_DIR="$XWIN_SPLAT" \
            -DCMAKE_BUILD_TYPE=Release \
            -DPython3_EXECUTABLE=python

      - name: Build
        run: cmake --build build-llvm --parallel

      - name: load_smoke
        continue-on-error: true
        run: |
          ./build-llvm/out/load_smoke.exe ./build-llvm/out/beacon.x64.dll
          ./build-llvm/out/load_smoke.exe ./build-llvm/out/winhttpb.x64.dll

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llvm-windows-x64
          path: |
            build-llvm/out/*.dll
            build-llvm/out/*.exe
            build-llvm/out/*.map
            build-llvm/out/*.obj
