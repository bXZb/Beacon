name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:

  udrl-x64:
    name: udrl x64 object (Phase 4 loader)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile UDRL object
        shell: pwsh
        # /GS- (no security cookie reference - the COFF must be free of
        # external symbols for the client's extract_reflective_loader),
        # /Zl (no default library record)
        run: |
          New-Item -ItemType Directory -Force -Path udrl\_build | Out-Null
          & cl /nologo /W3 /O2 /GS- /Zl /Gy- /DBW_UDRL_USER_DATA_DELIVER=1 /DBW_LOADER_PRIVATE=1 /c /Fo:udrl\_build\ReflectiveLoader.x64.o udrl\ReflectiveLoader.c
          if ($LASTEXITCODE -ne 0) { throw "udrl build failed" }
          Get-Item udrl\_build\ReflectiveLoader.x64.o | Select-Object Name,Length
          & cl /nologo /W3 /O2 /GS- /Zl /Gy- /DBW_UDRL_USER_DATA_DELIVER=1 /DBW_DIAG_RWX /c /Fo:udrl\_build\ReflectiveLoader.rwx.x64.o udrl\ReflectiveLoader.c
          if ($LASTEXITCODE -ne 0) { throw "udrl rwx build failed" }
          Get-Item udrl\_build\ReflectiveLoader.rwx.x64.o | Select-Object Name,Length

      # P4-3: our own EXE artifact template (no-jar-coupling delivery)
      - name: Link host EXE template
        shell: pwsh
        run: |
          & cl /nologo /W3 /O1 /GS- /MT /c /Fo:udrl\_build\hostexe.obj udrl\hostexe.c
          if ($LASTEXITCODE -ne 0) { throw "hostexe compile failed" }
          & link /nologo /SUBSYSTEM:WINDOWS /ENTRY:bw_entry /MACHINE:X64 /STACK:16777216 /DYNAMICBASE /NXCOMPAT /OUT:udrl\_build\host_template_x64.exe udrl\_build\hostexe.obj kernel32.lib libcmt.lib libvcruntime.lib libucrt.lib
          if ($LASTEXITCODE -ne 0) { throw "hostexe link failed" }
          Get-Item udrl\_build\host_template_x64.exe | Select-Object Name,Length

      - name: Report size
        shell: pwsh
        run: |
          $o = Get-Item "udrl\_build\ReflectiveLoader.x64.o"
          "udrl object = $($o.Length) bytes" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: udrl-x64
          path: |
            udrl\_build\ReflectiveLoader.x64.o
            udrl\_build\ReflectiveLoader.rwx.x64.o
            udrl\_build\host_template_x64.exe


