name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  dll:
    name: ${{ matrix.project }} x64 Release
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        project: [beacon, dnsb, extc2, pivot]
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 说明：runner 只有 v143 工具集；common.props 锁的 v142 是实机验证过的组合
      # （v143 在部分环境有 ICE 风险，见 docs/BUILD.md）。CI 用 v143 作为冒烟基线，
      # 失败即说明工具链漂移需要关注——这正是 CI 的价值。
      - name: Build
        shell: pwsh
        run: ./build.ps1 -Project ${{ matrix.project }} -Toolset v143

      - name: Build WinHTTP variant (beacon only)
        if: matrix.project == 'beacon'
        shell: pwsh
        run: ./build.ps1 -Project beacon -Toolset v143 -HttpLibrary winhttp

      - name: Report size
        shell: pwsh
        run: |
          $dll = Get-Item "x64/Release/${{ matrix.project }}.x64.dll"
          "$($dll.Name) = $($dll.Length) bytes" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      # stageless 形状冒烟：blob 补丁 → LoadLibrary → 导出验证 → 干净卸载
      - name: Load smoke (beacon variant only)
        if: matrix.project == 'beacon'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tests\_build | Out-Null
          & cl /nologo /W3 /EHsc /MT tests/load_smoke.cpp /Fe:tests\_build\load_smoke.exe /Fo:tests\_build\
          if ($LASTEXITCODE -ne 0) { throw "smoke build failed" }
          ./tests/_build/load_smoke.exe x64/Release/beacon.x64.dll
          ./tests/_build/load_smoke.exe x64/Release/winhttpb.x64.dll

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-x64
          path: |
            x64/Release/${{ matrix.project }}.x64.dll
            x64/Release/${{ matrix.project }}.x64.map

      - name: Upload WinHTTP artifact
        if: matrix.project == 'beacon'
        uses: actions/upload-artifact@v4
        with:
          name: beacon-winhttp-x64
          path: |
            x64/Release/winhttpb.x64.dll
            x64/Release/winhttpb.x64.map

  dll-x86:
    name: beacon x86 Release
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC (x64 host, x86 target)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build trimmed x86 libs
        shell: pwsh
        run: ./thirdparty/build_trimmed.ps1 -Arch x86

      - name: Stage x86 libs
        shell: pwsh
        run: |
          Copy-Item thirdparty/out/tomcrypt.x86.lib lib/tomcrypt.x86.lib -Force
          Copy-Item thirdparty/out/tommath.x86.lib lib/tommath.x86.lib -Force
          Get-Item lib/tomcrypt.x86.lib, lib/tommath.x86.lib | Format-Table Name, Length

      - name: Build beacon Win32
        shell: pwsh
        run: ./build.ps1 -Project beacon -Toolset v143 -Platform Win32

      - name: Report size
        shell: pwsh
        run: |
          $dll = Get-Item "Win32/Release/beacon.dll"
          "$($dll.Name) = $($dll.Length) bytes (cap 247808)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Load smoke (x86)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvarsall.bat'
          New-Item -ItemType Directory -Force -Path tests\_build86 | Out-Null
          cmd /c "`"$vcvars`" x64_x86 && cl /nologo /W3 /EHsc /MT tests\load_smoke.cpp /Fe:tests\_build86\load_smoke.exe /Fo:tests\_build86\"
          if ($LASTEXITCODE -ne 0) { throw "x86 smoke build failed" }
          ./tests/_build86/load_smoke.exe Win32/Release/beacon.dll

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: beacon-x86
          path: |
            Win32/Release/beacon.dll
            Win32/Release/beacon.map
            thirdparty/out/tomcrypt.x86.lib
            thirdparty/out/tommath.x86.lib

  tests:
    name: host-side unit tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build & run tests
        shell: pwsh
        # lib/ 现为自研精简重编库（1.18.2，keygen 健康），探针默认开启
        run: ./tests/run_tests.ps1 -ExtraDefines BEACON_TEST_ENABLE_KEYGEN
