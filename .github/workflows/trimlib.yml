name: trimlib

# Manual. Does not run on ordinary push. Invokes the CMake trimlib target,
# then reconfigures tests against thirdparty/out.
on:
  workflow_dispatch:

jobs:
  rebuild-trimmed:
    name: rebuild trimmed libs + acceptance
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset default

      - name: trimlib
        run: cmake --build --preset default --target trimlib

      - name: Acceptance
        run: |
          cmake --preset default -DBEACON_LIB_DIR=${{ github.workspace }}/thirdparty/out -DBEACON_TEST_EXTRA_DEFS=BEACON_TEST_ENABLE_KEYGEN
          cmake --build --preset default --target beacon_tests
          ctest --preset default --output-on-failure -R host_unit

      - name: Report sizes
        shell: pwsh
        run: |
          Get-ChildItem thirdparty/out/*.lib | ForEach-Object {
            "$($_.Name) = $($_.Length) bytes" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Upload rebuilt libs
        uses: actions/upload-artifact@v4
        with:
          name: trimmed-libs
          path: |
            thirdparty/out/tomcrypt.x64.lib
            thirdparty/out/tommath.x64.lib
